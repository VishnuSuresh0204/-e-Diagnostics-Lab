{% extends "lab_home.html" %}
{% block content %}

<!-- inner banner -->
<section class="inner-banner py-5">
    <div class="w3l-breadcrumb py-lg-5">
        <div class="container pt-5 pb-sm-4 pb-2">
            <h4 class="inner-text-title font-weight-bold pt-5">Lab</h4>
            <ul class="breadcrumbs-custom-path">
                <li><a href="/">Home</a></li>
                <li class="active"><i class="fas fa-angle-right mx-2"></i>Tests</li>
            </ul>
        </div>
    </div>
</section>
<!-- //inner banner -->

<!-- Upload Report -->
<section class="premium-form-container">
    <div class="premium-card animate-up" style="max-width: 600px; margin: auto;">
        
        <h3 class="premium-title text-center">Upload Test Result</h3>
        <p class="premium-subtitle text-center">Select the PDF or image report to provide results to the user.</p>

        <form method="post" class="needs-validation" enctype="multipart/form-data" novalidate>
            {% csrf_token %}

            <div class="premium-input-group">
                <label class="premium-label">Result Report (PDF/Image)</label>
                <input 
                    type="file" 
                    name="report" 
                    id="rep" 
                    class="premium-input"
                    accept=".pdf,image/*"
                    required>
                <div class="invalid-feedback">Please select a valid report file.</div>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="premium-button">
                    Upload Report <i class="fas fa-upload ml-2"></i>
                </button>
            </div>

        </form>

    </div>
</section>

<!-- Bootstrap validation -->

<script>
(function () {
'use strict'

const forms = document.querySelectorAll('.needs-validation')

Array.from(forms).forEach(function (form) {
form.addEventListener('submit', function (event) {

if (!form.checkValidity()) {
event.preventDefault()
event.stopPropagation()
}

form.classList.add('was-validated')

}, false)
})

})()
</script>

{% endblock %}
