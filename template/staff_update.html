{% extends "staff_home.html" %}
{% block content %}

<style>
.profile-card{
    max-width:600px;
    margin:auto;
    margin-top:80px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card-header{
    font-size:20px;
    font-weight:600;
    background:#0d6efd;
    color:white;
}

.form-label{
    font-weight:500;
}
</style>

<div class="container">

<div class="card profile-card">

<div class="card-header text-center">
Update Staff Profile
</div>

<div class="card-body">

<form method="POST">
{% csrf_token %}

<div class="mb-3">
<label class="form-label">Name</label>
<input type="text" name="name" class="form-control" value="{{ lab.name }}" required>
</div>

<div class="mb-3">
<label class="form-label">Location</label>
<input type="text" name="location" class="form-control" value="{{ lab.location }}" required>
</div>

<div class="mb-3">
<label class="form-label">Contact</label>
<input type="text" name="contact" class="form-control" value="{{ lab.contact }}" required>
</div>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" name="email" class="form-control" value="{{ lab.email }}" required>
</div>

<div class="mb-3">
<label class="form-label">Address</label>
<textarea name="address" class="form-control" rows="3" required>{{ lab.address }}</textarea>
</div>

<div class="text-center">
<button type="submit" class="btn btn-primary px-4">Update</button>
</div>

</form>

</div>
</div>

</div>

{% endblock %}
