{% extends "user_home.html" %}
{% block content %}

<section class="premium-form-container" style="padding-top: 100px; padding-bottom: 60px;">
    <div class="premium-card animate-up" style="max-width: 600px; margin: auto;">
        
        <h3 class="premium-title text-center">Select Lab Test</h3>
        <p class="premium-subtitle text-center">Choose the diagnostic test you wish to book.</p>

        <form method="post" class="needs-validation" novalidate>
            {% csrf_token %}

            <div class="premium-input-group">
                <label class="premium-label">Choose Test</label>
                <select name="test" class="premium-input" required>
                    <option value="" disabled selected>-- Select Test --</option>
                    {% for d in data %}
                        <option value="{{d.id}}">{{d.test}} (₹{{d.price}})</option>
                    {% endfor %}
                </select>
                <div class="invalid-feedback">Please select a test to continue.</div>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="premium-button">
                    Continue Booking <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </div>

        </form>

    </div>
</section>

<!-- Bootstrap validation -->

<script>
(function () {
'use strict'

const forms = document.querySelectorAll('.needs-validation')

Array.from(forms).forEach(function (form) {
form.addEventListener('submit', function (event) {

if (!form.checkValidity()) {
event.preventDefault()
event.stopPropagation()
}

form.classList.add('was-validated')

}, false)
})

})()
</script>

{% endblock %}
