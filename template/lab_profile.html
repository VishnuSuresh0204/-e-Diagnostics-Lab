{% extends "lab_home.html" %}
{% block content %}

<section class="premium-form-container" style="padding-top: 120px; padding-bottom: 60px;">
    <div class="premium-card animate-up" style="max-width: 600px;">
        <div class="text-center mb-4">
            {% if data.image %}
            <div class="profile-image-wrapper mb-3">
                <img src="/static/media/{{data.image}}" alt="Lab Profile" class="img-fluid rounded-circle shadow-lg" style="width: 150px; height: 150px; object-fit: cover; border: 4px solid #fff;">
            </div>
            {% else %}
            <div class="profile-image-placeholder mb-3">
                <i class="fas fa-microscope fa-5x text-muted"></i>
            </div>
            {% endif %}
            
            <h2 class="premium-title mb-0">{{data.name}}</h2>
            <p class="premium-subtitle"><i class="fas fa-map-marker-alt"></i> {{data.location}}</p>
        </div>

        <div class="profile-details-grid">
            <div class="premium-input-group mb-4">
                <label class="premium-label"><i class="fas fa-id-card"></i> Status</label>
                <div class="d-flex align-items-center">
                    <span class="badge {% if data.status == 'approved' or data.status == 'labApprove' %}bg-success{% elif data.status == 'pending' %}bg-warning{% else %}bg-danger{% endif %} px-3 py-2 rounded-pill">
                        {{data.status|capfirst}}
                    </span>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 premium-input-group">
                    <label class="premium-label"><i class="fas fa-phone"></i> Contact</label>
                    <p class="text-dark font-weight-bold">{{data.contact}}</p>
                </div>
                <div class="col-md-6 premium-input-group">
                    <label class="premium-label"><i class="fas fa-envelope"></i> Email</label>
                    <p class="text-dark font-weight-bold text-break">{{data.email}}</p>
                </div>
            </div>

            <div class="premium-input-group">
                <label class="premium-label"><i class="fas fa-map-marked-alt"></i> Office Address</label>
                <p class="text-dark">{{data.address}}</p>
            </div>
        </div>

        <div class="text-center mt-5">
            <a href="/update_lab/?id={{data.id}}" class="premium-button d-inline-block text-decoration-none" style="max-width: 250px;">
                <i class="fas fa-edit"></i> Edit Profile
            </a>
        </div>
    </div>
</section>

<style>
    .profile-image-wrapper {
        display: inline-block;
        position: relative;
    }
    .profile-image-wrapper::after {
        content: '';
        position: absolute;
        top: -5px;
        left: -5px;
        right: -5px;
        bottom: -5px;
        border-radius: 50%;
        background: var(--secondary-gradient);
        z-index: -1;
    }
    .profile-details-grid {
        background: rgba(255, 255, 255, 0.5);
        padding: 25px;
        border-radius: 15px;
        border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .premium-label i {
        margin-right: 8px;
        color: #764ba2;
    }
</style>

{% endblock %}
