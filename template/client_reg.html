{% extends "index.html" %}
{% block content %}
    <!-- inner banner -->
    <section class="inner-banner py-5">
        <div class="w3l-breadcrumb py-lg-5">
            <div class="container pt-5 pb-sm-4 pb-2">
                <h4 class="inner-text-title font-weight-bold pt-5">Join Us</h4>
                <ul class="breadcrumbs-custom-path">
                    <li><a href="">Home</a></li>
                    <li class="active"><i class="fas fa-angle-right mx-2"></i>User registration</li>
                </ul>
            </div>
        </div>
    </section>
    <!-- //inner banner -->

    <!-- registration -->
    <section class="premium-form-container">
        <div class="premium-card animate-up">
            <h3 class="premium-title">User Registration</h3>
            <p class="premium-subtitle">Join our platform to access diagnostic services easily.</p>
            
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 premium-input-group">
                        <label class="premium-label">First Name</label>
                        <input type="text" name="fname" class="premium-input" placeholder="Enter first name" required>
                    </div>
                    <div class="col-md-6 premium-input-group">
                        <label class="premium-label">Last Name</label>
                        <input type="text" name="lname" class="premium-input" placeholder="Enter last name" required>
                    </div>
                    <div class="col-md-6 premium-input-group">
                        <label class="premium-label">Email Address</label>
                        <input type="email" name="email" class="premium-input" placeholder="name@example.com" required>
                    </div>
                    <div class="col-md-6 premium-input-group">
                        <label class="premium-label">Phone Number</label>
                        <input type="number" name="phone" class="premium-input" placeholder="Enter phone number" required>
                    </div>
                    <div class="col-md-6 premium-input-group">
                        <label class="premium-label">Password</label>
                        <input type="password" name="password" class="premium-input" placeholder="Create a password" required>
                    </div>
                    <div class="col-md-6 premium-input-group">
                        <label class="premium-label">Profile Image</label>
                        <input type="file" name="image" class="premium-input" required>
                    </div>
                    <div class="col-md-12 premium-input-group">
                        <label class="premium-label">Address</label>
                        <textarea name="address" class="premium-input premium-textarea" placeholder="Enter your full address" required></textarea>
                    </div>
                    <div class="col-md-12 premium-input-group">
                        <label class="premium-label">Health Status</label>
                        <textarea name="health" class="premium-input premium-textarea" placeholder="Specify any special health conditions" required></textarea>
                    </div>
                </div>
                <div class="text-center">
                    <button type="submit" class="premium-button">Create Account</button>
                </div>
            </form>
        </div>
    </section>
