{% extends "index.html" %}
    {% block content %}

    <!-- inner banner -->
    <section class="inner-banner py-5">
        <div class="w3l-breadcrumb py-lg-5">
            <div class="container pt-5 pb-sm-4 pb-2">
                <h4 class="inner-text-title font-weight-bold pt-5">Join Us</h4>
                <ul class="breadcrumbs-custom-path">
                    <li><a href="index.html">Home</a></li>
                    <li class="active"><i class="fas fa-angle-right mx-2"></i>Login</li>
                </ul>
            </div>
        </div>
    </section>
    <!-- //inner banner -->

    <!-- login -->
    <section class="premium-form-container">
        <div class="premium-card animate-up" style="max-width: 500px;">
            <h3 class="premium-title">Welcome Back</h3>
            <p class="premium-subtitle">Login to your account to continue.</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="premium-input-group">
                    <label class="premium-label">Email Address</label>
                    <input type="email" name="email" class="premium-input" placeholder="Enter your email" required>
                </div>
                <div class="premium-input-group">
                    <label class="premium-label">Password</label>
                    <input type="password" name="password" class="premium-input" placeholder="Enter your password" required>
                </div>
                
                <div class="text-center mt-3">
                    <button type="submit" class="premium-button">Login</button>
                </div>
            </form>
        </div>
    </section>
