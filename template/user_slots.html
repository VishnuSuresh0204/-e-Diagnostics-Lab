{% extends "user_home.html" %}
{% block content %}

<style>
    .slot-card{
        border-radius:20px;
        padding:20px 10px;
        text-align:center;
        color:white;
        font-weight:600;
        transition:0.3s;
        margin-bottom:20px;
    }

    .slot-card:hover{
        transform:scale(1.05);
    }

    .slot-booked{
        background:#dc3545;
        cursor:not-allowed;
    }

    .slot-available{
        background:#28a745;
    }

    .slot-available a{
        color:white;
        text-decoration:none;
        display:block;
    }

    .slot-available:hover{
        background:#218838;
    }
</style>

<!-- inner banner -->

<section class="inner-banner py-5">
    <div class="w3l-breadcrumb py-lg-5">
        <div class="container pt-5 pb-sm-4 pb-2">
            <h4 class="inner-text-title font-weight-bold pt-5">User</h4>
            <ul class="breadcrumbs-custom-path">
                <li><a href="">Home</a></li>
                <li class="active"><i class="fas fa-angle-right mx-2"></i>Slots</li>
            </ul>
        </div>
    </div>
</section>

<section class="w3l-w3l-contacts-12 py-5">

<div class="container">

```
<div class="title-main text-center mx-auto mb-5">
    <h5 class="sub-title">Available</h5>
    <h3 class="title-style">Slots in {{lab}}</h3>
</div>

<div class="row">

    {% for d in data %}

    <div class="col-lg-2 col-md-3 col-sm-4 col-6">

        {% if d.user %}
        
        <div class="slot-card slot-booked">
            {{d.date}} <br>
            {{d.time}} <br>
            <small>Booked</small>
        </div>

        {% else %}

        <div class="slot-card slot-available">
            <a href="/user_bookslot?id={{d.id}}">
                {{d.date}} <br>
                {{d.time}} <br>
                <small>Book Now</small>
            </a>
        </div>

        {% endif %}

    </div>

    {% endfor %}

</div>
```

</div>

</section>

{% endblock %}
