{% extends "user_home.html" %}
{% block content %}

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

*{
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#667eea,#764ba2);
}

.payment-wrapper{
min-height:85vh;
display:flex;
justify-content:center;
align-items:center;
padding:40px 20px;
}

.payment-box{

width:100%;
max-width:950px;

background:rgba(255,255,255,0.1);
backdrop-filter:blur(18px);

border-radius:18px;

display:flex;
gap:40px;

padding:40px;

box-shadow:0 20px 50px rgba(0,0,0,.35);
}

/* CARD */

.credit-card{
width:340px;
height:200px;
perspective:1000px;
}

.card-inner{
width:100%;
height:100%;
position:relative;
transition:transform .6s;
transform-style:preserve-3d;
}

.credit-card.flip .card-inner{
transform:rotateY(180deg);
}

.card-front,
.card-back{

position:absolute;
width:100%;
height:100%;

border-radius:15px;

padding:25px;

color:white;

background:linear-gradient(135deg,#4facfe,#00f2fe);

backface-visibility:hidden;

}

.card-back{
transform:rotateY(180deg);
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
}

.card-number{

font-size:1.4rem;
letter-spacing:3px;

margin-top:30px;

}

.card-details{

display:flex;
justify-content:space-between;

margin-top:30px;

font-size:.9rem;

}

.card-label{
font-size:.65rem;
opacity:.7;
}

.card-value{
font-weight:500;
}

/* FORM */

.payment-form{
flex:1;
}

.payment-title{
font-size:1.8rem;
font-weight:600;
color:white;
margin-bottom:25px;
}

.form-group{
margin-bottom:18px;
}

.form-label{
display:block;
color:#fff;
font-size:.9rem;
margin-bottom:6px;
}

.form-control{

width:100%;

padding:12px;

border-radius:10px;

border:1px solid rgba(255,255,255,.35);

background:rgba(255,255,255,.15);

color:white;

font-size:.95rem;

}

.form-control::placeholder{
color:#eee;
}

.form-control:focus{

outline:none;

border-color:#fff;

background:rgba(255,255,255,.25);

}

.row-fields{
display:flex;
gap:12px;
}

select.form-control{
color:white;
}

select.form-control option{
color:black;
}

/* TOTAL */

.payment-total{

margin-top:20px;

padding:15px;

background:rgba(255,255,255,.12);

border-radius:10px;

display:flex;
justify-content:space-between;

color:white;

font-weight:600;

}

/* BUTTON */

.pay-button{

margin-top:20px;

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:linear-gradient(45deg,#00f2fe,#4facfe);

color:white;

font-weight:600;

font-size:1rem;

cursor:pointer;

transition:.3s;

}

.pay-button:hover{

transform:translateY(-2px);

box-shadow:0 10px 25px rgba(0,0,0,.3);

}

/* MOBILE */

@media(max-width:850px){

.payment-box{
flex-direction:column;
align-items:center;
}

.credit-card{
margin-bottom:10px;
}

}

</style>


<div class="payment-wrapper">

<div class="payment-box">

<!-- CARD -->

<div class="credit-card" id="card">

<div class="card-inner">

<div class="card-front">

<div class="card-number" id="cardNumber">
XXXX XXXX XXXX XXXX
</div>

<div class="card-details">

<div>
<div class="card-label">CARD HOLDER</div>
<div class="card-value" id="cardHolder">-</div>
</div>

<div>
<div class="card-label">EXPIRES</div>
<div class="card-value">
<span id="cardMonth">00</span> /
<span id="cardYear">00</span>
</div>
</div>

</div>

</div>

<div class="card-back">

<div class="card-label">CVC</div>
<div class="card-value" id="cardCVC">___</div>

</div>

</div>

</div>


<!-- FORM -->

<form method="post" action="" class="payment-form needs-validation" novalidate>

{% csrf_token %}

<div class="payment-title">

Payment Information

</div>

<div class="form-group">

<label class="form-label">Card Number</label>

<input

type="text"

name="card_number"

id="inputCardNumber"

class="form-control"

placeholder="1234 5678 9012 3456"

maxlength="19"

pattern="[0-9 ]{16,19}"

required>
<div class="invalid-feedback">Enter a valid 16-digit card number.</div>

</div>


<div class="form-group">

<label class="form-label">Card Holder</label>

<input

type="text"

name="card_holder"

id="inputCardHolder"

class="form-control"

placeholder="John Doe"

pattern="[A-Za-z ]{3,}"

required>
<div class="invalid-feedback">Enter card holder name.</div>

</div>


<div class="row-fields">

<div class="form-group">

<label class="form-label">Month</label>

<select name="expiry_month" id="inputMonth" class="form-control" required>

<option value="">MM</option>

<option>01</option>
<option>02</option>
<option>03</option>
<option>04</option>
<option>05</option>
<option>06</option>
<option>07</option>
<option>08</option>
<option>09</option>
<option>10</option>
<option>11</option>
<option>12</option>

</select>
<div class="invalid-feedback">Select month.</div>

</div>


<div class="form-group">

<label class="form-label">Year</label>

<select name="expiry_year" id="inputYear" class="form-control" required>

<option value="">YY</option>


<option>2026</option>
<option>2027</option>
<option>2028</option>
<option>2029</option>
<option>2030</option>
<option>2031</option>
<option>2032</option>
<option>2033</option>
<option>2034</option>
<option>2035</option>

</select>
<div class="invalid-feedback">Select year.</div>

</div>


<div class="form-group" style="max-width:100px">

<label class="form-label">CVC</label>

<input

type="text"

name="cvc"

id="inputCVC"

maxlength="3"

pattern="[0-9]{3}"

class="form-control"

placeholder="123"

required>
<div class="invalid-feedback">Enter 3-digit CVC.</div>

</div>

</div>


<div class="payment-total">

<span>Total Amount</span>

<span>₹{{amt}}</span>

</div>


<button class="pay-button" type="submit">

Pay Securely

</button>

</form>

</div>

</div>


<script>

const card=document.getElementById("card")

const cardNumberInput=document.getElementById("inputCardNumber")

const cardHolderInput=document.getElementById("inputCardHolder")

const monthInput=document.getElementById("inputMonth")

const yearInput=document.getElementById("inputYear")

const cvcInput=document.getElementById("inputCVC")

cardNumberInput.addEventListener("input",e=>{

let value=e.target.value.replace(/\D/g,'')

let formatted=value.match(/.{1,4}/g)?.join(" ") || ""

e.target.value=formatted

let placeholder="XXXX XXXX XXXX XXXX"

document.getElementById("cardNumber").innerText=

formatted+placeholder.substring(formatted.length)

})

cardHolderInput.addEventListener("input",e=>{

document.getElementById("cardHolder").innerText=

e.target.value || "-"

})

monthInput.addEventListener("change",e=>{

document.getElementById("cardMonth").innerText=e.target.value

})

yearInput.addEventListener("change",e=>{

document.getElementById("cardYear").innerText=e.target.value.slice(2)

})

cvcInput.addEventListener("focus",()=>{

card.classList.add("flip")

})

cvcInput.addEventListener("blur",()=>{

card.classList.remove("flip")

})

cvcInput.addEventListener("input",e=>{

let val=e.target.value.replace(/\D/g,'')

e.target.value=val

document.getElementById("cardCVC").innerText=

val.padEnd(3,"_")

})

// Bootstrap validation
(function () {
  'use strict'
  const forms = document.querySelectorAll('.needs-validation')
  Array.from(forms).forEach(function (form) {
    form.addEventListener('submit', function (event) {
      if (!form.checkValidity()) {
        event.preventDefault()
        event.stopPropagation()
      }
      form.classList.add('was-validated')
    }, false)
  })
})()

</script>

{% endblock %}
