{% extends "index.html" %}
{% block content %}
    <!-- inner banner -->
    <section class="inner-banner py-5">
        <div class="w3l-breadcrumb py-lg-5">
            <div class="container pt-5 pb-sm-4 pb-2">
                <h4 class="inner-text-title font-weight-bold pt-5">Join Us</h4>
                <ul class="breadcrumbs-custom-path">
                    <li><a href="">Home</a></li>
                    <li class="active"><i class="fas fa-angle-right mx-2"></i>Lab registration</li>
                </ul>
            </div>
        </div>
    </section>
    <!-- //inner banner -->

    <!-- registration -->
    <section class="premium-form-container">
        <div class="premium-card animate-up">
            <h3 class="premium-title">Lab Registration</h3>
            <p class="premium-subtitle">Register your laboratory to provide diagnostic services.</p>
            
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 premium-input-group">
                        <label class="premium-label">Lab Name</label>
                        <input type="text" name="fname" class="premium-input" placeholder="Enter lab name" required>
                    </div>
                    <div class="col-md-6 premium-input-group">
                        <label class="premium-label">Location</label>
                        <input type="text" name="loc" class="premium-input" placeholder="City or Region" required>
                    </div>
                    <div class="col-md-6 premium-input-group">
                        <label class="premium-label">Email Address</label>
                        <input type="email" name="email" class="premium-input" placeholder="lab@example.com" required>
                    </div>
                    <div class="col-md-6 premium-input-group">
                        <label class="premium-label">Phone Number</label>
                        <input type="number" name="phone" class="premium-input" placeholder="Contact number" required>
                    </div>
                    <div class="col-md-6 premium-input-group">
                        <label class="premium-label">Password</label>
                        <input type="password" name="password" class="premium-input" placeholder="Create a password" required>
                    </div>
                    <div class="col-md-6 premium-input-group">
                        <label class="premium-label">Profile Image</label>
                        <input type="file" name="image" class="premium-input" required>
                    </div>
                    <div class="col-md-12 premium-input-group">
                        <label class="premium-label">Full Address</label>
                        <textarea name="address" class="premium-input premium-textarea" placeholder="Enter complete laboratory address" required></textarea>
                    </div>
                </div>
                <div class="text-center">
                    <button type="submit" class="premium-button">Register Laboratory</button>
                </div>
            </form>
        </div>
    </section>
    <!-- //registration -->

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>
       
        // This example adds a search box to a map, using the Google Place Autocomplete
                         // feature. People can enter geographical searches. The search box will return a
                         // pick list containing a mix of places and predicted search terms.
                
                         // This example requires the Places library. Include the libraries=places
                         // parameter when you first load the API. For example:
                         // <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places">
                
                            function initAutocomplete() {
                             var map = new google.maps.Map(document.getElementById('map'), {
                                 center: { lat: 10.1076, lng: 76.3457 },
                                 zoom: 13,
                                 mapTypeId: 'roadmap'
                             });
                
                             google.maps.event.addListener(map, "click", function (event) {
                                 // get lat/lon of click
                                 var clickLat = event.latLng.lat();
                                 var clickLon = event.latLng.lng();
                
                                 // show in input box
                                 document.getElementById('l1').value = clickLat.toFixed(5);
                                 document.getElementById('l2').value = clickLon.toFixed(5);
                                
                        var somefunction = function () {
                            var hdnfldVariable = document.getElementById('hdnfldVariable');
                            hdnfldVariable.value = clickLat.toFixed(5);
                        }
                   
                
                
                                 var marker = new google.maps.Marker({
                                     position: new google.maps.LatLng(clickLat, clickLon),
                                     map: map,
                                     draggable:true
                                 });
                             });
                
                
                             // Create the search box and link it to the UI element.
                             var input = document.getElementById('pac-input');
                             var searchBox = new google.maps.places.SearchBox(input);
                             map.controls[google.maps.ControlPosition.TOP_LEFT].push(input);
                
                             // Bias the SearchBox results towards current map's viewport.
                             map.addListener('bounds_changed', function () {
                                 searchBox.setBounds(map.getBounds());
                             });
                
                             var markers = [];
                             // Listen for the event fired when the user selects a prediction and retrieve
                             // more details for that place.
                             searchBox.addListener('places_changed', function () {
                                 var places = searchBox.getPlaces();
                
                                 if (places.length == 0) {
                                     return;
                                 }
                
                                 // Clear out the old markers.
                                
                                 markers.forEach(function (marker) {
                                    debugger;
                                     marker.setMap(null);
                                     
                                    
                                 });
                                 markers = [];
                 
    
                                 // For each place, get the icon, name and location.
                                 var bounds = new google.maps.LatLngBounds();
                                 places.forEach(function (place) {
                                     if (!place.geometry) {
                                         console.log("Returned place contains no geometry");
                                         return;
                                     }
                                     var icon = {
                                         url: place.icon,
                                         size: new google.maps.Size(71, 71),
                                         origin: new google.maps.Point(0, 0),
                                         anchor: new google.maps.Point(17, 34),
                                         scaledSize: new google.maps.Size(25, 25)
                                     };
                
                                     // Create a marker for each place.
                                     markers.push(new google.maps.Marker({
                                         map: map,
                                         icon: icon,
                                         title: place.name,
                                         position: place.geometry.location
                                     }));
                
                                     if (place.geometry.viewport) {
                                         // Only geocodes have viewport.
                                         bounds.union(place.geometry.viewport);
                                     } else {
                                         bounds.extend(place.geometry.location);
                                     }
                                 });
                                 map.fitBounds(bounds);
                             });
                         }
                
                    </script>
                    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBRhhnbNUXPX9_JYKnroSAex2-1KFaSmwQ&libraries=places&callback=initAutocomplete"></script>
    <style>
        td,th{
            padding: 5px;
        }
        /* Always set the map height explicitly to define the size of the div
             * element that contains the map. */
             #map {
              height: 400px;
              width:500px;
              border-style:groove;
              border-width:thick;
              /*margin-left:300px;
              margin-top:30px;
              margin-bottom:30px;*/
            }
            /* Optional: Makes the sample page fill the window. */
            html, body {
              height: 100%;
              margin: 0;
              padding: 0;
            }
            #description {
              font-family: Roboto;
              font-size: 15px;
              font-weight: 300;
            }
      
            #infowindow-content .title {
              font-weight: bold;
            }
      
            #infowindow-content {
              display: none;
            }
      
            #map #infowindow-content {
              display: inline;
            }
      
            .pac-card {
              margin: 10px 10px 0 0;
              border-radius: 2px 0 0 2px;
              box-sizing: border-box;
              -moz-box-sizing: border-box;
              outline: none;
              box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
              background-color: #fff;
              font-family: Roboto;
            }
      
            #pac-container {
              padding-bottom: 12px;
              margin-right: 12px;
            }
      
            .pac-controls {
              display: inline-block;
              padding: 5px 11px;
            }
      
            .pac-controls label {

              font-size: 13px;

            }
      
            #pac-input {
              background-color: #fff;
              font-family: Roboto;
              font-size: 15px;
              font-weight: 300;
              margin-left: 12px;
              padding: 0 11px 0 13px;
              text-overflow: ellipsis;
              width: 400px;
            }
      
            #pac-input:focus {
              border-color: #4d90fe;
            }
      
            #title {
              color: #fff;
              background-color: #4d90fe;
              font-size: 25px;
              font-weight: 500;
              padding: 6px 12px;
            }
            #target {
              width: 345px;
            }
    </style>
    

{% endblock %}
